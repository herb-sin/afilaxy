name: CD - Deploy

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  deploy-internal:
    name: Deploy to Firebase App Distribution
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.repository == 'herb-sin/afilaxy'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: ${{ runner.os }}-gradle-
    
    - name: Grant execute permission
      run: chmod +x gradlew
    
    - name: Create local.properties
      run: echo "sdk.dir=$ANDROID_HOME" > local.properties
    
    - name: Validate secrets
      run: |
        if [ -z "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
          echo "❌ Error: GOOGLE_SERVICES_JSON secret is not configured"
          echo "Please configure this secret in Settings → Secrets and variables → Actions"
          echo "See .github/SECRETS_SETUP.md for instructions"
          exit 1
        fi
        if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" ]; then
          echo "❌ Error: FIREBASE_SERVICE_ACCOUNT secret is not configured"
          echo "This is required for Firebase App Distribution"
          exit 1
        fi
        echo "✅ All required secrets are configured"
    
    - name: Decode Firebase config
      run: |
        echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/google-services.json
        # Validate the decoded file is valid JSON
        if ! python3 -m json.tool app/google-services.json > /dev/null 2>&1; then
          echo "❌ Error: GOOGLE_SERVICES_JSON is not valid JSON or base64 encoding is incorrect"
          exit 1
        fi
        echo "✅ Firebase configuration decoded successfully"
    
    - name: Build release APK
      run: ./gradlew assembleRelease
      env:
        FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
    
    - name: Upload to Firebase App Distribution
      uses: wzieba/Firebase-Distribution-Github-Action@v1
      with:
        appId: ${{ secrets.FIREBASE_APP_ID }}
        serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        groups: testers
        file: app/build/outputs/apk/release/app-release.apk
        releaseNotes: |
          Versão automática do branch main
          Commit: ${{ github.sha }}

  deploy-production:
    name: Deploy to Play Store
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: ${{ runner.os }}-gradle-
    
    - name: Grant execute permission
      run: chmod +x gradlew
    
    - name: Create local.properties
      run: echo "sdk.dir=$ANDROID_HOME" > local.properties
    
    - name: Validate secrets for production deployment
      run: |
        if [ -z "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
          echo "❌ Error: GOOGLE_SERVICES_JSON secret is not configured"
          exit 1
        fi
        if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
          echo "❌ Error: KEYSTORE_BASE64 secret is not configured"
          echo "Production builds require a signing keystore"
          exit 1
        fi
        if [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ] || [ -z "${{ secrets.KEY_ALIAS }}" ] || [ -z "${{ secrets.KEY_PASSWORD }}" ]; then
          echo "❌ Error: Keystore credentials are incomplete"
          exit 1
        fi
        if [ -z "${{ secrets.PLAY_STORE_SERVICE_ACCOUNT }}" ]; then
          echo "❌ Error: PLAY_STORE_SERVICE_ACCOUNT secret is not configured"
          echo "This is required for Play Store deployment"
          exit 1
        fi
        echo "✅ All required secrets for production deployment are configured"
    
    - name: Decode Firebase config
      run: |
        echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/google-services.json
        if ! python3 -m json.tool app/google-services.json > /dev/null 2>&1; then
          echo "❌ Error: Invalid GOOGLE_SERVICES_JSON"
          exit 1
        fi
    
    - name: Decode keystore
      run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/keystore.jks
    
    - name: Create keystore.properties
      run: |
        echo "storeFile=keystore.jks" > keystore.properties
        echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> keystore.properties
        echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> keystore.properties
        echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties
    
    - name: Build AAB
      run: ./gradlew bundleRelease
      env:
        FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
    
    - name: Upload to Play Store
      uses: r0adkll/upload-google-play@v1
      with:
        serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT }}
        packageName: com.afilaxy
        releaseFiles: app/build/outputs/bundle/release/app-release.aab
        track: internal
        status: completed