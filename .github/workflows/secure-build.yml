name: Secure Build & Deploy

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
    
    - name: Create google-services.json
      env:
        FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
      run: |
        echo "$FIREBASE_CONFIG" > app/google-services.json
    
    - name: Create keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        echo "$KEYSTORE_BASE64" | base64 -d > app/keystore.jks
        echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> gradle.properties
        echo "KEY_ALIAS=$KEY_ALIAS" >> gradle.properties
        echo "KEY_PASSWORD=$KEY_PASSWORD" >> gradle.properties
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Run security checks
      run: |
        # Verificar se credenciais não estão hardcoded
        if grep -r "AIza" app/src/ --exclude-dir=build; then
          echo "❌ API keys found in source code!"
          exit 1
        fi
        echo "✅ Security check passed"
    
    - name: Build Debug APK
      run: ./gradlew assembleDebug
    
    - name: Build Release APK
      if: github.ref == 'refs/heads/main'
      run: ./gradlew assembleRelease
    
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: afilaxy-debug
        path: app/build/outputs/apk/debug/app-debug.apk
    
    - name: Upload Release APK
      if: github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v4
      with:
        name: afilaxy-release
        path: app/build/outputs/apk/release/app-release.apk
    
    - name: Clean sensitive files
      if: always()
      run: |
        rm -f app/google-services.json
        rm -f app/keystore.jks
        rm -f gradle.properties